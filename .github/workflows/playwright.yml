name: Playwright CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NANOTECH_TEST_EMAIL: ${{ secrets.NANOTECH_TEST_EMAIL }}
      NANOTECH_TEST_PASSWORD: ${{ secrets.NANOTECH_TEST_PASSWORD }}

    steps:
      - name: Decide whether this scheduled run matches 10 PM New York time
        id: run_window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub often starts scheduled runs hours late, so decide by which
          # cron fired, not by the current hour: 10 PM New York is 02:00 UTC
          # during EDT and 03:00 UTC during EST.
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "0 2 * * *|EDT"|"0 3 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "Cron '${{ github.event.schedule }}' with New York on $ny_tz -> should_run=$should_run"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Skip duplicate schedule slot
        if: steps.run_window.outputs.should_run != 'true'
        run: echo "Skipping this cron slot (the other DST slot for 10 PM America/New_York)."

      - name: Checkout repository
        if: steps.run_window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.run_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.run_window.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.run_window.outputs.should_run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright tests
        if: steps.run_window.outputs.should_run == 'true'
        run: python -m pytest tests --tb=short

      - name: Upload test results (screenshots, videos, traces per failed test)
        if: always() && steps.run_window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Slack on success
        if: success() && steps.run_window.outputs.should_run == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          STATUS_TEXT: passed
          STATUS_EMOJI: ":white_check_mark:"
        run: |
          python - <<'PY' > slack-payload.json
          import json, os
          payload = {
            "text": f"{os.environ['STATUS_EMOJI']} Playwright CI {os.environ['STATUS_TEXT']}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": (
                    f"{os.environ['STATUS_EMOJI']} *Playwright CI {os.environ['STATUS_TEXT']}*\n"
                    f"*Repo:* `{os.environ['GITHUB_REPOSITORY']}`\n"
                    f"*Branch:* `{os.environ['GITHUB_REF_NAME']}`\n"
                    f"*Event:* `{os.environ['GITHUB_EVENT_NAME']}`\n"
                    f"*Actor:* `{os.environ['GITHUB_ACTOR']}`"
                  ),
                },
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Open workflow run"},
                    "url": os.environ["RUN_URL"],
                  }
                ],
              },
            ],
          }
          print(json.dumps(payload))
          PY
          curl -sS -X POST -H 'Content-type: application/json' --data @slack-payload.json "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on failure
        if: failure() && steps.run_window.outputs.should_run == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          STATUS_TEXT: failed
          STATUS_EMOJI: ":x:"
        run: |
          python - <<'PY' > slack-payload.json
          import json, os
          payload = {
            "text": f"{os.environ['STATUS_EMOJI']} Playwright CI {os.environ['STATUS_TEXT']}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": (
                    f"{os.environ['STATUS_EMOJI']} *Playwright CI {os.environ['STATUS_TEXT']}*\n"
                    f"*Repo:* `{os.environ['GITHUB_REPOSITORY']}`\n"
                    f"*Branch:* `{os.environ['GITHUB_REF_NAME']}`\n"
                    f"*Event:* `{os.environ['GITHUB_EVENT_NAME']}`\n"
                    f"*Actor:* `{os.environ['GITHUB_ACTOR']}`"
                  ),
                },
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Open workflow run"},
                    "url": os.environ["RUN_URL"],
                  }
                ],
              },
            ],
          }
          print(json.dumps(payload))
          PY
          curl -sS -X POST -H 'Content-type: application/json' --data @slack-payload.json "$SLACK_WEBHOOK_URL"

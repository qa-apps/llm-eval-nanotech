name: Playwright CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NANOTECH_TEST_EMAIL: ${{ secrets.NANOTECH_TEST_EMAIL }}
      NANOTECH_TEST_PASSWORD: ${{ secrets.NANOTECH_TEST_PASSWORD }}

    steps:
      - name: Decide whether this scheduled run matches 10 PM New York time
        id: run_window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=America/New_York date +%H)"
          if [ "$local_hour" = "22" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip duplicate schedule slot
        if: steps.run_window.outputs.should_run != 'true'
        run: echo "Skipping this cron slot because it is not 10 PM in America/New_York."

      - name: Checkout repository
        if: steps.run_window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Checkout existing gh-pages site
        if: steps.run_window.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Setup Python
        if: steps.run_window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.run_window.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        if: steps.run_window.outputs.should_run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright tests
        if: steps.run_window.outputs.should_run == 'true'
        run: python -m pytest tests --tb=short --junitxml=test-results/junit.xml

      - name: Upload test results (screenshots, videos, traces per failed test)
        if: always() && steps.run_window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Playwright Pages UI
        if: always() && steps.run_window.outputs.should_run == 'true'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ env.RUN_URL }}
        run: python scripts/build_playwright_site.py

      - name: Publish Playwright Pages UI
        if: always() && steps.run_window.outputs.should_run == 'true' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "playwright site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Notify Slack on success
        if: success() && steps.run_window.outputs.should_run == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          STATUS_TEXT: passed
          STATUS_EMOJI: ":white_check_mark:"
          PLAYWRIGHT_DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/playwright/runs/${{ github.run_number }}/
        run: |
          python - <<'PY' > slack-payload.json
          import json, os
          payload = {
            "text": f"{os.environ['STATUS_EMOJI']} Playwright CI {os.environ['STATUS_TEXT']}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": (
                    f"{os.environ['STATUS_EMOJI']} *Playwright CI {os.environ['STATUS_TEXT']}*\n"
                    f"*Repo:* `{os.environ['GITHUB_REPOSITORY']}`\n"
                    f"*Branch:* `{os.environ['GITHUB_REF_NAME']}`\n"
                    f"*Event:* `{os.environ['GITHUB_EVENT_NAME']}`\n"
                    f"*Actor:* `{os.environ['GITHUB_ACTOR']}`"
                  ),
                },
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Open Playwright GitHub UI"},
                    "url": os.environ["PLAYWRIGHT_DASHBOARD_URL"],
                  },
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Open workflow run"},
                    "url": os.environ["RUN_URL"],
                  }
                ],
              },
            ],
          }
          print(json.dumps(payload))
          PY
          curl -sS -X POST -H 'Content-type: application/json' --data @slack-payload.json "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on failure
        if: failure() && steps.run_window.outputs.should_run == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          STATUS_TEXT: failed
          STATUS_EMOJI: ":x:"
          PLAYWRIGHT_DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/playwright/runs/${{ github.run_number }}/
        run: |
          python - <<'PY' > slack-payload.json
          import json, os
          payload = {
            "text": f"{os.environ['STATUS_EMOJI']} Playwright CI {os.environ['STATUS_TEXT']}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": (
                    f"{os.environ['STATUS_EMOJI']} *Playwright CI {os.environ['STATUS_TEXT']}*\n"
                    f"*Repo:* `{os.environ['GITHUB_REPOSITORY']}`\n"
                    f"*Branch:* `{os.environ['GITHUB_REF_NAME']}`\n"
                    f"*Event:* `{os.environ['GITHUB_EVENT_NAME']}`\n"
                    f"*Actor:* `{os.environ['GITHUB_ACTOR']}`"
                  ),
                },
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Open Playwright GitHub UI"},
                    "url": os.environ["PLAYWRIGHT_DASHBOARD_URL"],
                  },
                  {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "Open workflow run"},
                    "url": os.environ["RUN_URL"],
                  }
                ],
              },
            ],
          }
          print(json.dumps(payload))
          PY
          curl -sS -X POST -H 'Content-type: application/json' --data @slack-payload.json "$SLACK_WEBHOOK_URL"

name: DeepEval Nightly

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Run scope"
        required: false
        type: choice
        options:
          - smoke
          - standard
        default: standard
  schedule:
    # 5:15 AM America/New_York. Both UTC slots cover daylight-saving time;
    # the gate below starts only the matching slot.
    - cron: "15 9 * * *"
    - cron: "15 10 * * *"

concurrency:
  group: deepeval-cloud-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Evaluate scheduled run window
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_tz="$(TZ=America/New_York date +%Z)"
          case "${{ github.event.schedule }}|$ny_tz" in
            "15 9 * * *|EDT"|"15 10 * * *|EST") should_run=true ;;
            *) should_run=false ;;
          esac
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  deepeval:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      eval_date: ${{ steps.eval_day.outputs.date }}
      completion_ready: ${{ steps.completion_gate.outputs.ready }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_DEEPEVAL_CHANNEL_ID: ${{ secrets.SLACK_DEEPEVAL_CHANNEL_ID }}
      NANOTECH_TEST_EMAIL: ${{ secrets.NANOTECH_TEST_EMAIL }}
      NANOTECH_TEST_PASSWORD: ${{ secrets.NANOTECH_TEST_PASSWORD }}
      RUN_LLM_EVALS: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      NANOTECH_LLM_MAX_ATTEMPTS: "3"
      NANOTECH_LLM_RETRY_BASE_DELAY: "2.0"
      NANOTECH_LLM_REQUEST_PAUSE: "0.5"
      CLOUD_EVAL_BASE_URL: http://127.0.0.1:18765/v1
      CLOUD_EVAL_ROUTE_MODE: go-primary
      CLOUD_EVAL_API_KEY: cloud-eval
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LOCAL_LLM_TIMEOUT_SEC: "180"
      NANOTECH_API_TIMEOUT_SEC: "120"
      NANOTECH_UI_CHAT_TIMEOUT_MS: "120000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve daily evaluation date
        id: eval_day
        shell: bash
        run: |
          now_minutes=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now_minutes" -lt 1350 ]; then
            eval_day=$(TZ=America/New_York date -d yesterday +%F)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            eval_day=$(TZ=America/New_York date +%F)
          else
            eval_day="manual-${{ github.run_id }}"
          fi
          echo "date=$eval_day" >> "$GITHUB_OUTPUT"
          echo "scope=${{ inputs.scope || 'standard' }}" >> "$GITHUB_OUTPUT"

      - name: Restore daily completion marker
        id: daily_marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/deepeval.done
          key: cloud-deepeval-v1-${{ steps.eval_day.outputs.date }}

      - name: Start cloud judge and verify a real completion
        id: cloud_llm
        if: steps.daily_marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -u .github/scripts/cloud_gateway.py > cloud-gateway.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18765/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 120 http://127.0.0.1:18765/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"cloud-eval","messages":[{"role":"user","content":"Reply OK"}],"max_tokens":64}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["choices"][0]["message"]["content"]'
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Report cloud judge failure
        if: failure() && steps.cloud_llm.outcome == 'failure'
        run: |
          python3 .github/scripts/notify_eval_status_slack.py \
            --channel "$SLACK_DEEPEVAL_CHANNEL_ID" \
            --suite "DeepEval Nightly" --detail "Cloud judge failed its live completion check; tests did not run."

      - name: Checkout existing gh-pages site
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Setup Python
        if: steps.cloud_llm.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.cloud_llm.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        id: install_browser
        if: steps.cloud_llm.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Record DeepEval run start
        if: steps.cloud_llm.outputs.run == 'true'
        run: python3 -c 'import os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"]).joinpath("deepeval-start-ns").write_text(str(time.time_ns()))'

      - name: Run DeepEval smoke sequentially
        if: steps.cloud_llm.outputs.run == 'true' && steps.eval_day.outputs.scope == 'smoke'
        id: smoke
        continue-on-error: true
        run: |
          RUN_LLM_EVALS=1 python -m pytest tests/llmEval/test_chatbot_deepeval.py::TestChatbotQuality::test_01_chat_returns_a_meaningful_response --tb=short

      - name: Run DeepEval API and browser 12-test suite sequentially
        if: steps.cloud_llm.outputs.run == 'true' && steps.eval_day.outputs.scope == 'standard'
        id: standard
        continue-on-error: true
        run: |
          RUN_LLM_EVALS=1 python -m pytest \
            tests/llmEval/test_chatbot_deepeval.py \
            tests/llmEval/test_chatbot_judge_ui.py \
            --output="test-results/llm-${GITHUB_RUN_ID}" --tb=short

      - name: Validate complete DeepEval report
        id: report_contract
        if: always() && steps.cloud_llm.outputs.run == 'true'
        env:
          EXPECTED_CASES: ${{ steps.eval_day.outputs.scope == 'smoke' && '1' || '12' }}
          SCOPE: ${{ steps.eval_day.outputs.scope }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          STANDARD_OUTCOME: ${{ steps.standard.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          candidates = [Path(".deepeval/.latest_run_full.json")]
          candidates.extend(sorted(Path(".deepeval").glob("test_run_*.json"), reverse=True))
          report_path = next((path for path in candidates if path.is_file()), None)
          if report_path is None:
              raise SystemExit("Missing DeepEval JSON report")
          started = int(Path(os.environ["RUNNER_TEMP"]).joinpath("deepeval-start-ns").read_text())
          if report_path.stat().st_mtime_ns < started:
              raise SystemExit(f"DeepEval report is stale: {report_path}")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          cases = report.get("testCases") or []
          expected = int(os.environ["EXPECTED_CASES"])
          if len(cases) != expected:
              raise SystemExit(f"DeepEval report has {len(cases)}/{expected} cases")
          for case in cases:
              if not case.get("name") or not case.get("input") or not case.get("actualOutput"):
                  raise SystemExit("A DeepEval case is missing name, prompt, or answer")
              metrics = case.get("metricsData") or []
              if not metrics or any(not metric.get("name") for metric in metrics):
                  raise SystemExit("A DeepEval case is missing judge metrics")
              if not isinstance(case.get("success"), bool):
                  raise SystemExit("A DeepEval case is missing its quality verdict")
          quality_passed = all(case["success"] for case in cases)
          outcome = (
              os.environ["SMOKE_OUTCOME"]
              if os.environ["SCOPE"] == "smoke"
              else os.environ["STANDARD_OUTCOME"]
          )
          expected_outcome = "success" if quality_passed else "failure"
          if outcome != expected_outcome:
              raise SystemExit(
                  f"DeepEval step outcome {outcome!r} does not match "
                  f"the complete report quality verdict {expected_outcome!r}"
              )
          print(f"Validated {len(cases)} DeepEval cases in {report_path}")
          PY

      - name: Upload DeepEval raw results
        id: upload_results
        if: always() && steps.cloud_llm.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepeval-results-${{ github.run_number }}
          path: .deepeval/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

      - name: Upload browser failure evidence
        id: upload_browser_evidence
        if: always() && steps.cloud_llm.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llm-browser-failures-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build DeepEval Pages UI
        id: build_pages
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ env.RUN_URL }}
        run: python scripts/build_deepeval_site.py

      - name: Upload Pages site for isolated publisher
        id: upload_pages
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success' && steps.build_pages.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: deepeval-pages-${{ github.run_id }}
          path: gh-pages-site/
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack
        id: notify_slack
        if: always() && steps.cloud_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          DEEPEVAL_DASHBOARD_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/deepeval/runs/${{ github.run_number }}/"
          python .github/scripts/notify_deepeval_slack.py \
            --channel "$SLACK_DEEPEVAL_CHANNEL_ID" \
            --results-dir .deepeval \
            --dashboard-url "$DEEPEVAL_DASHBOARD_URL" \
            --require-delivery

      - name: Evaluate daily completion gate
        id: completion_gate
        if: always() && steps.cloud_llm.outputs.run == 'true'
        env:
          BROWSER_INSTALL: ${{ steps.install_browser.outcome }}
          REPORT_CONTRACT: ${{ steps.report_contract.outcome }}
          RESULTS_UPLOAD: ${{ steps.upload_results.outcome }}
          BROWSER_EVIDENCE_UPLOAD: ${{ steps.upload_browser_evidence.outcome }}
          PAGES_BUILD: ${{ steps.build_pages.outcome }}
          PAGES_UPLOAD: ${{ steps.upload_pages.outcome }}
          DEEPEVAL_SLACK: ${{ steps.notify_slack.outcome }}
          SCOPE: ${{ steps.eval_day.outputs.scope }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          STANDARD_OUTCOME: ${{ steps.standard.outcome }}
        run: |
          ready=true
          for outcome in "$BROWSER_INSTALL" "$REPORT_CONTRACT" "$RESULTS_UPLOAD" "$BROWSER_EVIDENCE_UPLOAD" "$PAGES_BUILD" "$PAGES_UPLOAD" "$DEEPEVAL_SLACK"; do
            [ "$outcome" = "success" ] || ready=false
          done
          if [ "$SCOPE" = "smoke" ]; then
            [ "$SMOKE_OUTCOME" = "success" ] || [ "$SMOKE_OUTCOME" = "failure" ] || ready=false
          else
            [ "$STANDARD_OUTCOME" = "success" ] || [ "$STANDARD_OUTCOME" = "failure" ] || ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = "true" ] || echo "::warning::Daily marker withheld because report, artifact, Pages input, or Slack delivery was incomplete."

      - name: Fail if DeepEval failed
        if: steps.cloud_llm.outputs.run == 'true'
        run: |
          if [ "${{ steps.smoke.outcome }}" = "failure" ] || \
             [ "${{ steps.standard.outcome }}" = "failure" ]; then
            exit 1
          fi


  publish-deepeval-pages:
    name: Publish Pages from GitHub-hosted runner
    if: always() && needs.deepeval.result != 'skipped'
    needs: deepeval
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated Pages site
        id: download_pages
        if: needs.deepeval.outputs.completion_ready == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: deepeval-pages-${{ github.run_id }}
          path: gh-pages-site

      - name: Publish Pages site
        id: publish_pages
        if: needs.deepeval.outputs.completion_ready == 'true' && steps.download_pages.outcome == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "deepeval site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enforce Pages publication
        if: always() && needs.deepeval.outputs.completion_ready == 'true' && (steps.download_pages.outcome != 'success' || steps.publish_pages.outcome != 'success')
        run: |
          echo "::error::DeepEval Pages publication failed."
          exit 1

      - name: Save daily completion marker
        if: >-
          always() && github.event_name == 'schedule' &&
          needs.deepeval.outputs.completion_ready == 'true' &&
          steps.publish_pages.outcome == 'success'
        shell: bash
        run: |
          mkdir -p .ci-markers
          date -u +%FT%TZ > .ci-markers/deepeval.done

      - name: Cache daily completion marker
        if: >-
          always() && github.event_name == 'schedule' &&
          needs.deepeval.outputs.completion_ready == 'true' &&
          steps.publish_pages.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/deepeval.done
          key: cloud-deepeval-v1-${{ needs.deepeval.outputs.eval_date }}

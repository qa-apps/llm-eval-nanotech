name: DeepEval Nightly

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Run scope"
        required: false
        type: choice
        options:
          - smoke
          - standard
        default: standard
  schedule:
    # Check hourly; run once per New York day when bosgame is available.
    - cron: "30 * * * *"

concurrency:
  group: deepeval-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  deepeval:
    runs-on: [self-hosted, Linux, X64, bosgame]
    timeout-minutes: 480
    outputs:
      eval_date: ${{ steps.eval_day.outputs.date }}
      completion_ready: ${{ steps.completion_gate.outputs.ready }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_DEEPEVAL_CHANNEL_ID: ${{ secrets.SLACK_DEEPEVAL_CHANNEL_ID }}
      NANOTECH_TEST_EMAIL: ${{ secrets.NANOTECH_TEST_EMAIL }}
      NANOTECH_TEST_PASSWORD: ${{ secrets.NANOTECH_TEST_PASSWORD }}
      RUN_LLM_EVALS: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      NANOTECH_LLM_MAX_ATTEMPTS: "3"
      NANOTECH_LLM_RETRY_BASE_DELAY: "2.0"
      NANOTECH_LLM_REQUEST_PAUSE: "0.5"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      LOCAL_LLM_BASE_URL: http://127.0.0.1:11434/v1
      LOCAL_LLM_MODEL: ${{ github.event_name == 'schedule' && 'scheduled/gpt-oss:120b' || 'gpt-oss:120b' }}
      LOCAL_LLM_PRIORITY_MAX_WAIT_SEC: ${{ github.event_name == 'schedule' && '21600' || '0' }}
      # LOCAL_LLM_API_KEY is not pinned here so a gateway key exported by the
      # bosgame runner service (EnvironmentFile llm-gateway.env) is used;
      # utils/nanotech_judge.py and the checks fall back to "ollama".
      LOCAL_LLM_TIMEOUT_SEC: "300"
      NANOTECH_API_TIMEOUT_SEC: "120"
      NANOTECH_UI_CHAT_TIMEOUT_MS: "120000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve daily evaluation date
        id: eval_day
        shell: bash
        run: |
          now_minutes=$((10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$now_minutes" -lt 1350 ]; then
            eval_day=$(TZ=America/New_York date -d yesterday +%F)
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            eval_day=$(TZ=America/New_York date +%F)
          else
            eval_day="manual-${{ github.run_id }}"
          fi
          echo "date=$eval_day" >> "$GITHUB_OUTPUT"
          echo "scope=${{ inputs.scope || 'standard' }}" >> "$GITHUB_OUTPUT"

      - name: Restore daily completion marker
        id: daily_marker
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/deepeval.done
          key: bosgame-deepeval-${{ steps.eval_day.outputs.date }}

      - name: Check and warm local GPT-OSS
        id: local_llm
        if: steps.daily_marker.outputs.cache-hit != 'true'
        shell: bash
        run: |
          model_ready=false
          # Since 2026-09-14 the gateway answers 401 without a key; send the runner-provided one.
          KEY="${LOCAL_LLM_API_KEY:-ollama}"
          # The catalog lists the upstream id; the scheduled alias may be routed without being listed.
          if models=$(curl --connect-timeout 5 --max-time 15 --fail --silent --show-error -H "Authorization: Bearer $KEY" "$OLLAMA_BASE_URL/v1/models") && \
             python3 -c 'import json,sys; wanted=[w for w in sys.argv[1:] if w]; ids=[m.get("id") for m in json.load(sys.stdin).get("data", [])]; ok=any(w in ids for w in wanted); ok or print(f"::warning::None of {wanted} is listed by the model catalog; available: {ids}"); raise SystemExit(0 if ok else 1)' "$LOCAL_LLM_MODEL" "gpt-oss:120b" <<<"$models"; then
            response=$(curl --connect-timeout 5 --max-time 300 --fail --silent --show-error \
              "$LOCAL_LLM_BASE_URL/chat/completions" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
              -H "X-LLM-Model: gpt-oss:120b" \
              -d "{\"model\":\"$LOCAL_LLM_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Return JSON: {\\\"ready\\\": true}\"}],\"temperature\":0,\"max_tokens\":256,\"response_format\":{\"type\":\"json_object\"},\"stream\":false}") || true
            if python3 -c 'import json,sys; data=json.load(sys.stdin); content=data["choices"][0]["message"].get("content", "").strip(); raise SystemExit(0 if content else 1)' <<<"$response"; then
              model_ready=true
            fi
          fi
          if [ "$model_ready" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Local model unavailable or not producing output (reason above); the next hourly schedule will retry."
          fi

      - name: Nightly Bosgame — report unavailable
        if: steps.daily_marker.outputs.cache-hit != 'true' && steps.local_llm.outputs.run != 'true'
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "DeepEval Nightly" --event down

      - name: Nightly Bosgame — report available
        if: steps.local_llm.outputs.run == 'true'
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "DeepEval Nightly" --event up

      - name: Checkout existing gh-pages site
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Setup Python
        if: steps.local_llm.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.local_llm.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        id: install_browser
        if: steps.local_llm.outputs.run == 'true'
        # The hardened self-hosted runner blocks sudo. Its system libraries are
        # preinstalled, so download the browser bundle without --with-deps.
        run: python -m playwright install chromium

      - name: Record DeepEval run start
        if: steps.local_llm.outputs.run == 'true'
        run: python3 -c 'import os,time; from pathlib import Path; Path(os.environ["RUNNER_TEMP"]).joinpath("deepeval-start-ns").write_text(str(time.time_ns()))'

      - name: Run DeepEval smoke sequentially
        if: steps.local_llm.outputs.run == 'true' && steps.eval_day.outputs.scope == 'smoke'
        id: smoke
        continue-on-error: true
        run: |
          RUN_LLM_EVALS=1 python -m pytest tests/llmEval/test_chatbot_deepeval.py::TestChatbotQuality::test_01_chat_returns_a_meaningful_response --tb=short

      - name: Run DeepEval API and browser 12-test suite sequentially
        if: steps.local_llm.outputs.run == 'true' && steps.eval_day.outputs.scope == 'standard'
        id: standard
        continue-on-error: true
        run: |
          RUN_LLM_EVALS=1 python -m pytest \
            tests/llmEval/test_chatbot_deepeval.py \
            tests/llmEval/test_chatbot_judge_ui.py \
            --output="test-results/llm-${GITHUB_RUN_ID}" --tb=short

      - name: Validate complete DeepEval report
        id: report_contract
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          EXPECTED_CASES: ${{ steps.eval_day.outputs.scope == 'smoke' && '1' || '12' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          candidates = [Path(".deepeval/.latest_run_full.json")]
          candidates.extend(sorted(Path(".deepeval").glob("test_run_*.json"), reverse=True))
          report_path = next((path for path in candidates if path.is_file()), None)
          if report_path is None:
              raise SystemExit("Missing DeepEval JSON report")
          started = int(Path(os.environ["RUNNER_TEMP"]).joinpath("deepeval-start-ns").read_text())
          if report_path.stat().st_mtime_ns < started:
              raise SystemExit(f"DeepEval report is stale: {report_path}")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          cases = report.get("testCases") or []
          expected = int(os.environ["EXPECTED_CASES"])
          if len(cases) != expected:
              raise SystemExit(f"DeepEval report has {len(cases)}/{expected} cases")
          for case in cases:
              if not case.get("name") or not case.get("input") or not case.get("actualOutput"):
                  raise SystemExit("A DeepEval case is missing name, prompt, or answer")
              metrics = case.get("metricsData") or []
              if not metrics or any(not metric.get("name") for metric in metrics):
                  raise SystemExit("A DeepEval case is missing judge metrics")
          print(f"Validated {len(cases)} DeepEval cases in {report_path}")
          PY

      - name: Upload DeepEval raw results
        id: upload_results
        if: always() && steps.local_llm.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepeval-results-${{ github.run_number }}
          path: .deepeval/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

      - name: Upload browser failure evidence
        id: upload_browser_evidence
        if: always() && steps.local_llm.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llm-browser-failures-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build DeepEval Pages UI
        id: build_pages
        if: always() && steps.local_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ env.RUN_URL }}
        run: python scripts/build_deepeval_site.py

      - name: Upload Pages site for isolated publisher
        id: upload_pages
        if: always() && steps.local_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success' && steps.build_pages.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: deepeval-pages-${{ github.run_id }}
          path: gh-pages-site/
          retention-days: 1
          if-no-files-found: error

      - name: Notify Slack
        id: notify_slack
        if: always() && steps.local_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          OWNER_LC=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          DEEPEVAL_DASHBOARD_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/deepeval/runs/${{ github.run_number }}/"
          python .github/scripts/notify_deepeval_slack.py \
            --channel "$SLACK_DEEPEVAL_CHANNEL_ID" \
            --results-dir .deepeval \
            --dashboard-url "$DEEPEVAL_DASHBOARD_URL" \
            --require-delivery

      - name: Nightly Bosgame — post results
        id: notify_daily
        if: always() && steps.local_llm.outputs.run == 'true' && steps.report_contract.outcome == 'success'
        run: |
          python3 .github/scripts/notify_bosgame_run_slack.py \
            --channel "${{ secrets.SLACK_NIGHTLY_BOSGAME_CHANNEL_ID }}" \
            --suite "DeepEval Nightly" --event result \
            --format deepeval --results .deepeval \
            --require-delivery

      - name: Evaluate daily completion gate
        id: completion_gate
        if: always() && steps.local_llm.outputs.run == 'true'
        env:
          BROWSER_INSTALL: ${{ steps.install_browser.outcome }}
          REPORT_CONTRACT: ${{ steps.report_contract.outcome }}
          RESULTS_UPLOAD: ${{ steps.upload_results.outcome }}
          BROWSER_EVIDENCE_UPLOAD: ${{ steps.upload_browser_evidence.outcome }}
          PAGES_BUILD: ${{ steps.build_pages.outcome }}
          PAGES_UPLOAD: ${{ steps.upload_pages.outcome }}
          DEEPEVAL_SLACK: ${{ steps.notify_slack.outcome }}
          DAILY_SLACK: ${{ steps.notify_daily.outcome }}
          SCOPE: ${{ steps.eval_day.outputs.scope }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          STANDARD_OUTCOME: ${{ steps.standard.outcome }}
        run: |
          ready=true
          for outcome in "$BROWSER_INSTALL" "$REPORT_CONTRACT" "$RESULTS_UPLOAD" "$BROWSER_EVIDENCE_UPLOAD" "$PAGES_BUILD" "$PAGES_UPLOAD" "$DEEPEVAL_SLACK" "$DAILY_SLACK"; do
            [ "$outcome" = "success" ] || ready=false
          done
          if [ "$SCOPE" = "smoke" ]; then
            [ "$SMOKE_OUTCOME" = "success" ] || [ "$SMOKE_OUTCOME" = "failure" ] || ready=false
          else
            [ "$STANDARD_OUTCOME" = "success" ] || [ "$STANDARD_OUTCOME" = "failure" ] || ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = "true" ] || echo "::warning::Daily marker withheld because report, artifact, Pages input, or Slack delivery was incomplete."

      - name: Fail if DeepEval failed
        if: steps.local_llm.outputs.run == 'true'
        run: |
          if [ "${{ steps.smoke.outcome }}" = "failure" ] || \
             [ "${{ steps.standard.outcome }}" = "failure" ]; then
            exit 1
          fi

      - name: Release background model lease
        if: always() && github.event_name == 'schedule'
        run: |
          curl -fsS -X POST \
            -H "X-LLM-Job-ID: $GITHUB_RUN_ID" \
            http://127.0.0.1:11443/release/background || true

  publish-deepeval-pages:
    name: Publish Pages from GitHub-hosted runner
    if: always()
    needs: deepeval
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated Pages site
        id: download_pages
        if: needs.deepeval.outputs.completion_ready == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: deepeval-pages-${{ github.run_id }}
          path: gh-pages-site

      - name: Publish Pages site
        id: publish_pages
        if: needs.deepeval.outputs.completion_ready == 'true' && steps.download_pages.outcome == 'success'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./gh-pages-site
          force_orphan: false
          keep_files: true
          enable_jekyll: false
          commit_message: "deepeval site: run #${{ github.run_number }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Enforce Pages publication
        if: always() && needs.deepeval.outputs.completion_ready == 'true' && (steps.download_pages.outcome != 'success' || steps.publish_pages.outcome != 'success')
        run: |
          echo "::error::DeepEval Pages publication failed."
          exit 1

      - name: Save daily completion marker
        if: >-
          always() && github.event_name == 'schedule' &&
          needs.deepeval.outputs.completion_ready == 'true' &&
          steps.publish_pages.outcome == 'success'
        shell: bash
        run: |
          mkdir -p .ci-markers
          date -u +%FT%TZ > .ci-markers/deepeval.done

      - name: Cache daily completion marker
        if: >-
          always() && github.event_name == 'schedule' &&
          needs.deepeval.outputs.completion_ready == 'true' &&
          steps.publish_pages.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ci-markers/deepeval.done
          key: bosgame-deepeval-${{ needs.deepeval.outputs.eval_date }}
